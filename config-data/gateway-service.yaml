server:
  port: ${PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}  

spring:
  cloud:
    gateway:      
      server: 
        webflux:
          discovery:
            locator:
              enabled: true 
              lower-case-service-id: true 
          # default-filters bien indentado dentro de la estructura webflux
          default-filters:
            - RewritePath=/^/.*?/(?<remaining>.*)$, /${remaining} 